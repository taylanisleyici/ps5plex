# ps5plex — Real-Debrid -> Plex -> PS5
#
# Start:  docker compose up          (foreground; Ctrl+C stops everything)
# Stop:   Ctrl+C
#
# `restart: no` is deliberate and load-bearing: nothing here should ever come back
# on its own or survive the terminal you started it in.

services:
  rdserve:
    build:
      context: .
      dockerfile: rdserve/Dockerfile
    container_name: ps5plex-rdserve
    restart: "no"
    environment:
      RD_TOKEN: ${RD_TOKEN:?RD_TOKEN is not set — copy .env.example to .env and fill it in}
      RD_REFRESH_SECS: ${RD_REFRESH_SECS:-300}
    volumes:
      # Written by the watchlist robot: the only titles that get served.
      - ps5plex-state:/state
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  plex:
    build:
      # Context is the repo root so the Dockerfile can COPY librarian/ as well.
      context: .
      dockerfile: docker/plex.Dockerfile
    container_name: ps5plex-plex
    restart: "no"
    depends_on:
      rdserve:
        condition: service_healthy
    # Required for rclone's FUSE mount inside the container.
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      TZ: ${TZ:-UTC}
      VERSION: docker
      # Only needed on the very first run — get one at https://plex.tv/claim
      # (it expires 4 minutes after you generate it).
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      # This Mac's LAN address, so Plex advertises something the PS5 can reach.
      PLEX_ADVERTISE_URL: ${PLEX_ADVERTISE_URL:-}
      # The librarian needs this to ask Plex to scan — without it Plex answers
      # 401 and newly linked files sit there unnoticed until a scheduled scan.
      PLEX_TOKEN: ${PLEX_TOKEN:-}
    volumes:
      - plex-config:/config
      - plex-library:/library
      - ps5plex-state:/state
      # On disk, not tmpfs: a 6 GB RAM disk got filled by a high-bitrate
      # transcode and the kernel SIGKILLed the transcoder mid-playback.
      - plex-transcode:/transcode
      - ./config/rclone.conf:/etc/rclone/rclone.conf:ro
      - ./config/overrides.yml:/etc/ps5plex/overrides.yml:ro
    ports:
      # Lands on the loopback relay (see docker/loopback-proxy.sh), not on Plex
      # directly, so Plex sees clients as local rather than "(WAN)".
      - "32400:33400"

  picker:
    build:
      context: .
      dockerfile: watchlist/Dockerfile
    container_name: ps5plex-picker
    restart: "no"
    # No depends_on: this talks to Plex, the scraper and Real-Debrid only, so a
    # slow rdserve start must not hold the picker back.
    environment:
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      RD_TOKEN: ${RD_TOKEN:-}
      SCRAPER_URL: ${SCRAPER_URL:-}
      WATCHLIST_INTERVAL: ${WATCHLIST_INTERVAL:-120}
      # Off by default: pick sources yourself in the picker (PICKER_PORT).
      SUBS_DIR: /state/subs
      AUTO_FETCH: ${AUTO_FETCH:-0}
      MAX_PER_TITLE: ${MAX_PER_TITLE:-3}
    ports:
      - "${PICKER_PORT:-8099}:8081"
    volumes:
      # Shared with the librarian: what you asked for, and nothing else.
      - ps5plex-state:/state

volumes:
  plex-config:
  plex-transcode:
  plex-library:
  ps5plex-state:
