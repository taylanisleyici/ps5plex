# zurg — presents your Real-Debrid library as WebDAV on :9999
#
# This file is a TEMPLATE and holds no credentials, so it is safe to commit.
# compose.yaml prepends `token:` from .env at container start, because zurg only
# reads the TOKEN env var when no config file exists yet.
zurg: v1
port: 9999

concurrent_workers: 20
check_for_changes_every_secs: 10

# Keep the original torrent/release name on disk. Plex's scanner parses release
# names well, which is what lets us skip symlink-renaming machinery entirely.
retain_rd_torrent_name: true
retain_folder_name_extension: true

# RAR'd torrents are useless for streaming — drop them rather than surface them.
auto_delete_rar_torrents: true

# The library split Plex sees. Order matters: first match wins, so shows must be
# tested before the movies catch-all.
directories:
  shows:
    group: media
    # Directories are a YAML map, and Go iterates maps in random order, so
    # without an explicit order the movies catch-all below can win every time.
    group_order: 1
    # has_episodes alone matched nothing here, so these patterns come straight
    # from the real folder names in this account. List entries are OR'd.
    filters:
      - has_episodes: true
      - regex: /[Ss][0-9]{1,2}[Ee][0-9]{1,3}/          # The.Boys.S05E01
      - regex: /[Ss]eason[ ._-]?[0-9]{1,2}/            # Frieren - Season 1
      - regex: /[Ss][0-9]{2}([ ._-]|$)/                # Spider.Noir.S01.BW
      - regex: /[Ss][0-9]{2}-[Ss]?[0-9]{2}/            # Regular Show S01-08
      - regex: /Сезон[ ._-]?[0-9]+/                    # Russian releases
  movies:
    group: media
    group_order: 2
    # Release groups like Tigole ship the feature alongside a dozen featurettes
    # and trailers in one folder. Plex's movie scanner treats every video file in
    # a folder as its own movie, so it will happily match a 120 MB "making of" as
    # the film. Exposing only the largest file per torrent fixes it at the source.
    only_show_the_biggest_file: true
    filters:
      - regex: /.*/
