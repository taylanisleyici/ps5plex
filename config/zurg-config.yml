# zurg — presents your Real-Debrid library as WebDAV on :9999
#
# This file is a TEMPLATE and holds no credentials, so it is safe to commit.
# compose.yaml prepends `token:` from .env at container start, because zurg only
# reads the TOKEN env var when no config file exists yet.
zurg: v1
port: 9999

concurrent_workers: 20
check_for_changes_every_secs: 10

# Keep the original release name — the librarian parses it to work out what each
# torrent actually is.
retain_rd_torrent_name: true
retain_folder_name_extension: true

# RAR'd torrents are useless for streaming — drop them rather than surface them.
auto_delete_rar_torrents: true

# No `directories:` rules on purpose. Splitting movies from shows by regex on the
# release name was wrong often enough to matter (and got every series filed as a
# movie whenever Go happened to iterate the config map in the unlucky order).
# zurg just serves everything under __all__; librarian/classify.py does the
# classification with a real release-name parser and builds the tree Plex reads.
